<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Prabhjot Singh Dhiman</title>
  <desc id="hero-desc">IT support and cybersecurity technologist working across network defense, AI, and web development.</desc>
  <defs>
    <linearGradient id="psd-hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".58" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <linearGradient id="psd-hero-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset=".48" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
    <radialGradient id="psd-hero-glow"><stop offset="0" stop-color="#C77B9B" stop-opacity=".23"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
    <pattern id="psd-hero-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width=".7"/></pattern>
    <filter id="psd-hero-blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <mask id="psd-hero-fade"><rect width="1200" height="390" fill="url(#psd-hero-bg)"/><circle cx="970" cy="80" r="330" fill="white"/></mask>
  </defs>
  <rect width="1200" height="390" rx="20" fill="url(#psd-hero-bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#psd-hero-grid)"/>
  <circle cx="980" cy="80" r="330" fill="url(#psd-hero-glow)"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity=".34">
    <ellipse cx="982" cy="190" rx="164" ry="67" transform="rotate(-32 982 190)"/>
    <ellipse cx="982" cy="190" rx="164" ry="67" transform="rotate(42 982 190)"/>
    <circle cx="982" cy="190" r="108" stroke-dasharray="2 8"/>
  </g>
  <g fill="#E5B5C7"><circle cx="842" cy="115" r="3"/><circle cx="1094" cy="246" r="3"/><circle cx="1008" cy="84" r="2.5"/></g>
  <path d="M760 292 C830 250 850 315 910 274 S1010 230 1080 272 S1130 300 1180 255" fill="none" stroke="#C77B9B" stroke-width="2" opacity=".35"/>
  <path d="M760 292 C830 250 850 315 910 274 S1010 230 1080 272 S1130 300 1180 255" fill="none" stroke="url(#psd-hero-sheen)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="26 560">
    <animate attributeName="stroke-dashoffset" values="586;0" dur="8s" repeatCount="indefinite"/>
  </path>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="72" fill="#E5B5C7" font-size="13" letter-spacing="4">ENGINEERING · SECURITY · SYSTEMS</text>
    <text x="68" y="154" fill="#F8F0F3" font-size="48" font-weight="650" letter-spacing="-1.6">Prabhjot Singh</text>
    <text x="68" y="211" fill="#F8F0F3" font-size="48" font-weight="650" letter-spacing="-1.6">Dhiman</text>
    <rect x="70" y="236" width="270" height="3" rx="1.5" fill="url(#psd-hero-sheen)"/>
    <rect x="70" y="236" width="270" height="3" rx="1.5" fill="#E5B5C7" filter="url(#psd-hero-blur)" opacity=".75">
      <animate attributeName="opacity" values=".28;.95;.28" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="274" fill="#E5B5C7" font-size="17" letter-spacing=".8">IT SUPPORT  /  CYBERSECURITY</text>
    <text x="72" y="303" fill="#C77B9B" font-size="15" letter-spacing=".6">AI projects · Network defense · Web development</text>
    <text x="72" y="354" fill="#F8F0F3" fill-opacity=".55" font-size="11" letter-spacing="2.5">BUILD WITH PURPOSE. DEFEND BY DESIGN.</text>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#C77B9B" stroke-opacity=".3"/>
</svg>